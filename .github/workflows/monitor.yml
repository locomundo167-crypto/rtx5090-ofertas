name: Vigilar ofertas RTX 5090

on:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: rtx5090-monitor
  cancel-in-progress: false

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar ofertas
        run: python monitor.py
      - name: Guardar ofertas ya notificadas
        run: |
          git config user.name "rtx5090-monitor[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Registrar ofertas notificadas" && git push)
      - name: Avisar de ofertas nuevas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -c "import json,sys; sys.exit(0 if json.load(open('new_offers.json', encoding='utf-8')) else 1)"; then
            gh issue create --title "Nueva oferta RTX 5090 detectada" --body-file latest.md --assignee locomundo167-crypto
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
