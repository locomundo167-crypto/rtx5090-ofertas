name: Vigilar ofertas RTX 5090

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rtx5090-monitor
  cancel-in-progress: false

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar ofertas
        run: python monitor.py --all
      - name: Guardar estado e informe
        run: |
          git config user.name "rtx5090-monitor[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json latest.md docs/index.html
          git diff --cached --quiet || git commit -m "Actualizar ofertas RTX 5090"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4

