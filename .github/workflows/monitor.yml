name: Vigilar reservas Zelda Switch 2

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python monitor.py
      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json latest.md new_offers.json docs/index.html
          git diff --cached --quiet || git commit -m "Actualizar seguimiento Zelda Switch 2"
          git push
      - name: Avisar por GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(python -c "import json; print(len(json.load(open('new_offers.json'))))")" -gt 0 ]; then
            gh issue create --title "Reserva Zelda Switch 2 disponible" --body-file latest.md --assignee locomundo167-crypto
          fi
